name: Installed codemode distributions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/codemode.yml"
      - "package*.json"
      - "packages/**"
      - "platform/web/**"
      - "test/package*.mjs"
      - "bin/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/codemode.yml"
      - "package*.json"
      - "packages/**"
      - "platform/web/**"
      - "test/package*.mjs"
      - "bin/**"

permissions:
  contents: read

jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: ["22.19.0", "24", "26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: node --experimental-transform-types --test-concurrency=1 --test platform/web/test/codemode.test.ts platform/web/test/codemode-lifecycle.test.ts
      - run: npm run test:package
        env:
          PI_OFFLINE: "1"
          PYLON_NO_UPDATE_CHECK: "1"
